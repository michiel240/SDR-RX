name: Build Windows SLIM (EXE + Decoders)

on:
  workflow_dispatch:
  push:
    paths:
      - 'sdr_studio/**'
      - 'tests/**'
      - 'tools/build_windows_slim.py'
      - 'tools/setup_windows_bundle.py'
      - 'requirements-windows-slim.txt'
      - '.github/workflows/build-windows-slim.yml'

permissions:
  contents: read

jobs:
  windows-slim:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Minimal runtime and build tools
        run: python -m pip install -r requirements-windows-slim.txt -r requirements-tests.txt "pyinstaller>=6,<7"
      - name: All software tests
        run: python -m pytest -q
      - name: Official decoders and Airspy x64 library
        run: python tools/setup_windows_bundle.py --airspy
      - name: Build portable Windows SLIM and run bundled EXE selftest
        run: python tools/build_windows_slim.py
      - name: Package complete slim distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          python tools/rapport_grootte_windows.py 'dist/SDR-Studio-RX' 'dist/SDR-Studio-RX-SLIM' | Out-File -FilePath 'release/GROOTTE_RAPPORT.txt' -Encoding utf8
          Compress-Archive -Path 'dist/SDR-Studio-RX-SLIM' -DestinationPath 'release/SDR-Studio-RX-Windows-SLIM-Portable.zip' -CompressionLevel Optimal
      - name: Downloadable complete Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SDR-Studio-RX-Windows-SLIM
          path: release/*
          if-no-files-found: error
          retention-days: 30
